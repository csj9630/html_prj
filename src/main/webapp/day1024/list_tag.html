<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>목록 태그</title>
</head>
<body>
<!--li는 ol,ul의 하위 태크로 정의해야 한다.  -->
<!--하지만 에러는 안 난다.  -->
<!-- <li>리스트항목</li>
<li>리스트항목</li> -->
<h3>순서 목록</h3>
<h4>type 속성에는 1이 기본값, a, A, i로 순서 타입 변경</h4>
<ol type="a">
	<li>미스릴 투구</li>
	<li >유령신부의드레스</li>
	<li>하트 온 파이어</li>
	<li value="100">헤르메스 부츠</li>
	<li>전술 강화 모듈</li>
</ol>

<h3>글머리 기호 목록</h3>
<h4>type 속성 : disc(기본값),circle,square</h4>
<ul type="disc">
	<li>생명의나무</li>
	<li>운석</li>
	<li>미스릴</li>
	<li>포스코어</li>
	<li>혈액팩</li>
</ul>

<h3> 설명 목록 </h3>
<dl>
	<dt>제목</dt>
	<dd>제목에 대한 설명</dd>
	<dt>자바</dt>
	<dd>최초의 객체지향 언어</dd>
	<dt>JDBC</dt>
	<dd>자바와 DBMS를 연동하기 우해 지원하는 API</dd>
</dl>

</body>
</html>
