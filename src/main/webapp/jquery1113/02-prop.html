<style type="text/css">
#wrap{  margin: 0px auto; width: 1200px; height: 1000px; }	
#header{ height: 150px;	 }	
#container{ height: 700px;	 }	
#footer{ height: 150px;}	
</style>

<!-- JQuery 세트 -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<!--JS 실습 파트-->
<script type="text/javascript">
$(function() {
	$("#btn").click(setProp); //버튼 클릭하면 useAttr 실행
});//ready

function setProp(){
	$("#domain option:eq(1)").prop("selected",true);
	}//setProp
	function setProp2(){
	$("#domain > option:eq(3)").prop("selected",true);
	}//setProp
</script>

<body>
<div id="wrap">
	<div id="header">header 1200(w) x 150(h)
			사이트로고, 주력서비스, navigation bar
	 </div>
	<div id="container">
		<div>
			<select name="domain" id="domain"> 
				<option value="google.com">구글</option>
				<option value="naver.com">네이버</option>
				<option value="daum.net">다음</option>
				<option value="nate.com">네이트</option>
			</select>
	<input type="button" value="선택상태 변경" class="btn btn-primary" id="btn"/>
	<input type="button" value="선택상태 변경" class="btn btn-primary" id="btn2"/>
	</div>

		</div>

</div>
