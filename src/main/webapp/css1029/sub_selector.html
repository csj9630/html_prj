<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
div>span {
	color: #FF00FF
}
#divID>span{background-color: #0099FF }
</style>
</head>
<body>
	<h3>sub selector</h3>
	어제는
	<span>화요일</span>입니다.
	<div>
		오늘은 <span>수요일</span>입니다
	</div>
	<p>
		내일은 <span>목요일입니다.</span>
	</p>
	<!-- sub selector는 적용되지 않아야하는 태그에도 적용된다. -->
	<table>
		<tr>
			<td><div id="divID">
					자바는 <span>객체지향</span>언어 입니다 .
				</div></td>
		</tr>
	</table>
</body>
</html>
