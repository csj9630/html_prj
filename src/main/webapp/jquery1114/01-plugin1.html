<!-- JQuery 플러그인  DatePicker 추가  -->

 <!-- DatePicker 쓰기 위한 파트 --> 
 <script>
  $( function() {
    $( "#datepicker" ).datepicker({
      numberOfMonths: 1,
      showButtonPanel: true,
      dateFormat: "yy-mm-dd DD",
      dayNameMin: [ "일", "월", "화", "수", "목", "금", "토" ],
      dayNamesShort: [ "일", "월", "화", "수", "목", "금", "토" ],
      dayNames: [ "일", "월", "화", "수", "목", "금", "토" ],
      monthNames: [ "1월", "Februar", "3", "4", "5", "6", "7", "8", "September", "Oktober", "November", "December" ]

    });
  } );
  </script>
