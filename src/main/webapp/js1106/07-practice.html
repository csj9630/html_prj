<style type="text/css">
#wrap{  margin: 0px auto; width: 1200px; height: 1000px; }	
#header{ height: 150px;	 }	
#container{ height: 700px;	 }	
#footer{ height: 150px;}	

#output{ width: 400px; height: 200px; border: 1px solid #333;
	font-size: 20px;} 
.warnMsg{ color: #FF0000 }
</style>
<script type="text/javascript">
function setData(){

	var obj=document.frm;
	
	var date=new Date();
	var nowYear= date.getFullYear();
	
	var output="";
	
	var ssn=obj.ssn.value; //주민번호 앞자리
	var ssn2=obj.ssn2.value;//주민번호 뒷자리
	var flag=ssn2.charAt(0);//뒷자리의 첫번째. 성별, 태어난해 연산용
	var gender="남자";//성별
	
	var workFlag=(ssn+""+ssn2).length == 13; //작업 flag : 13자리인가?
			
	if(workFlag){
		
	var preYear=18;
	//태어난해 구하기 : 1800년대, 1900년대, 2000년대 생의 앞자리 구하기
	if( flag == 1 || flag == 2|| flag == 5|| flag == 6){
		preYear=19;
	}else if(flag == 3 || flag == 4|| flag == 7|| flag == 8){
		preYear=20;
	}//end if
	
	//성별구하기
	gender= parseInt(flag) % 2==0?"여자":"남자";
	
	//생년월일 출력용
	var birthYear=preYear+ssn.substring(0,2);
	var birthMonth=preYear+ssn.substring(2,4);
	var birthDay=preYear+ssn.substring(4,6);
	//나이 출력용
	var age=nowYear - parseInt( birthYear )+1;
	
	//띠 출력용
	var zodiac="monkey,rooster,dog,pig,rat,ox,tiger,rabbit,dragon,snake,horse,sheep".split(",");
	
	//출력
	output += `<strong>이름 : </strong> ${ obj.name.value }님 <br>`;
	output += `<strong>태어난해 : </strong> ${ birthYear }년 <br>`;
	output += `<strong>성별 : </strong> ${ gender } <br>`;
	output += `<strong>나이 : </strong> ${ age }살 <br>`;
	output += `<marquee scrollamount='10' direction='left'  behavior="slide"><img src="images/${zodiac[birthYear%12]}.png"></marquee>`;
	
	}//end if
	
	if( !workFlag ){
		output="<span class='warnMsg'>주민번호의 자릿수를 확인해 주세요</span>";
	}//end if
	
	document.getElementById("output").innerHTML=output;
	
}//setData
</script>
</head>
<body>
<div id="wrap">
	<div id="header">header 1200(w) x 150(h)
			사이트로고, 주력서비스, navigation bar
	 </div>
	<div id="container">
	<div>
	<form name="frm">
	<table>
	<tr>
	<td colspan="2" style="text-align: center;font-weight: bold; font-size: 25px">
		정보를 입력해주세요.
	</td>
	</tr>
	<tr>
		<td style="width: 120px">
			<label for="name">이름</label>
		</td>
		<td style="width: 400px">
			<input type="text" name="name" id="name" value="민병조"/>
		</td>
	</tr>
	<tr>
		<td>
			<label for="ssn">주민등록번호</label>
		</td>
		<td>
			<input  value="880101" type="text" name="ssn" id="ssn" maxlength="6" style="width:60px"/> -
			<input value="1234567" type="password" name="ssn2" id="ssn2" maxlength="7" style="width:70px"/>
		</td>
	</tr>
	<tr>
	<td colspan="2" style="text-align: center">
		<input type="button" value="입력" class="btn btn-success" 
			onclick="setData()">
	</td> 
	</tr>
	</table>
	</form>
	<div id="output"></div>
	</div>
	
	</div>
	<div id="footer">footer 1200(w) x 150(h)</div>
</div>
