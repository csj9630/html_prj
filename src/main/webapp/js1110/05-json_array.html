<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon" href="http://192.168.10.82/html_prj/common/images/favicon.ico">
<meta charset="UTF-8">
<title>이터널리턴 지금바로다운로드</title>
<!--실습에서 만든 CSS <link rel="stylesheet" type="text/css" href="http://192.168.10.82/html_prj/common/css/main_v251031.css"/>-->
<!-- bootStrap CDN ---------------------->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
 <!----------------------- bootStrap CDN -->
 
<style type="text/css">
#wrap{  margin: 0px auto; width: 1200px; height: 1000px; }	
#header{ height: 150px;	 }	
#container{ height: 700px;	 }	
#footer{ height: 150px;}	
</style>
<!--JS 실습 파트-->
<script type="text/javascript">
window.onload=function(){
	//1. JSONArray 생성 : [ { 이름:값,,, },{ 이름:값,,, },{ 이름:값,,, }, ]
	var jsonArr=[
			{name:"민병조",email:"min@test.com"},
			{name:"신승덕",email:"shin@test.com"},
			{email:"woo@google.com",name:"임성우"},
			{name:"이정우",email:"lee@daum.net"},
			{name:"이지원",email:"lee2@nate.com"}
			];
	
	//배열 추가
	var jsonTemp={name:"김똘복",email:"TTolBok@gmail.com"};
	jsonArr.push(jsonTemp);
	
	
	//2.반복
	var jsonObj;// JSONArray에 있는 JSONObject을 저장하기위한 변수
	
	var output=`<table class='table table-hover'>
		<thead>
		<tr>
		<th style='width:100px'>번호</th>
		<th style='width:150px'>이름</th>
		<th style='width:300px'>이메일</th>
		</tr>
		</thead>
		<tbody>
	`;
	
	
	for( var i=0; i < jsonArr.length ; i++){
		jsonObj=jsonArr[i];
		
		//3.반복 중인 방의 값을 parsing하여 보여준다.
		output +=`<tr>
					<td>${ i +1 }</td>
					<td>${ jsonObj.name }</td>
					<td>${ jsonObj.email }</td>
				</tr>`;
	}//end for
	
	output +=`</tbody></table>`;
	document.getElementById("output").innerHTML=output;
}//onload
</script>
</head>
<body>
<div id="wrap">
	<!-- wrap 1200(w) x 1000(h) -->
	<div id="header"> 	 </div>
	<div id="container">
	
		<div id="output"></div>
	 </div>
	
	<div id="footer"> </div>
</div>
</body>
</html>
