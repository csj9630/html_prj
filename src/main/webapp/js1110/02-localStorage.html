<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon"
	href="http://192.168.10.82/html_prj/common/images/favicon.ico">
<meta charset="UTF-8">
<title>이터널리턴 지금바로다운로드</title>
<!--실습에서 만든 CSS <link rel="stylesheet" type="text/css" href="http://192.168.10.82/html_prj/common/css/main_v251031.css"/>-->
<!-- bootStrap CDN ---------------------->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
	crossorigin="anonymous"></script>
<!----------------------- bootStrap CDN -->

<style type="text/css">
#wrap {
	margin: 0px auto;
	width: 1200px;
	height: 1000px;
}

#header {
	height: 150px;
}

#container {
	height: 700px;
}

#footer {
	height: 150px;
}
</style>
<!--JS 실습 파트-->
<script type="text/javascript">
	let ls = window.localStorage;
	let divNode;
	var obj;
	
window.onload=function(){
	//1.스토리지 얻기
	document.getElementById("btnSetItem").addEventListener("click",setItem);
	document.getElementById("btnGetItem").addEventListener("click",getItem);
	document.getElementById("btnRemoveItem").addEventListener("click",removeItem);
	
	divNode = document.getElementById("output");
	obj = document.frm;
	
}//window

function setItem() {
	//입력값을 얻어와서 storage에 설정
	//console.log(obj);
	var name =obj.name.value;
	var age =obj.age.value;
	var color =obj.color.value;
	
	
	//2. item 설정
	ls.setItem("name",name);
	ls.setItem("age",age);
	ls.setItem("color",color);
	divNode.innerHTML="세션 스토리지에 값(아이템) 저장";
	
}//setItem

function getItem(){
	//storage 값을 html form control에 설정.
	//아이템의 값 얻기
	var name=ls.getItem("name");
	var age=ls.getItem("age");
	var color=ls.getItem("color");
	
	if( name == null ){
		alert("값을 먼저 입력해주세요.");
		return;
	}//end if
	
	//HTML Form Control에 값 설정
	obj.name.value=name;
	obj.age.value=age;
	//obj.color.value=color;
	for(var i=0; i < obj.color.length ; i++){
		if( obj.color[i].value == color){
			obj.color[i].selected=true;
			break;
		}//end if
	}//end for
	
	//출력용 DIV에 얻은 값을 출력
	divNode.innerHTML=`<ul>
						<li>이름 : ${ name }</li>
						<li>나이 : ${ age }</li>
						<li>플래그 : ${ color }</li>						
						</ul>
	`;	
}//getItem

function removeItem() {
	//하나 지우기
	//ls.removeItem("name");
	//전체 지우기
	ls.clear();
}//removeItem

</script>
</head>
<body>
	<div id="wrap">
		<!-- wrap 1200(w) x 1000(h) -->
		<div id="header"></div>
		<div id="container">
			<h1>LocalHost HTML</h1>
			<div>
				<form name="frm">
					<label>이름</label> <input type="text" name="name" id="name"><br />
					<label>나이</label> <input type="text" name="age" id="age"><br />
					<label>좋아하는 색</label><input type="color" name="color" id="color"> 
				</form>
				<br />
			</div>

			<br>
			<div>
				<input type="button" value="lpcalStorage 저장"
					class="btn btn-success" id="btnSetItem" /> 
				<input type="button" value="sessionStorage 값얻기" class="btn btn-primary" id="btnGetItem" />
				<input type="button" value="sessionStorage 값삭제"
					class="btn btn-danger" id="btnRemoveItem" />
			</div>
			<div id="output"></div>
		</div>

		<div id="footer"></div>
	</div>
</body>
</html>
