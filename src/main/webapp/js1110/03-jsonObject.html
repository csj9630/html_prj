<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon"
	href="http://192.168.10.82/html_prj/common/images/favicon.ico">
<meta charset="UTF-8">
<title>이터널리턴 지금바로다운로드</title>
<!--실습에서 만든 CSS <link rel="stylesheet" type="text/css" href="http://192.168.10.82/html_prj/common/css/main_v251031.css"/>-->
<!-- bootStrap CDN ---------------------->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
	crossorigin="anonymous"></script>
<!----------------------- bootStrap CDN -->

<style type="text/css">
#wrap {
	margin: 0px auto;
	width: 1200px;
	height: 1000px;
}

#header {
	height: 150px;
}

#container {
	height: 700px;
}

#footer {
	height: 150px;
}
</style>
<!--JS 실습 파트-->
<script type="text/javascript">
window.onload=function(){
	document.getElementById("btnStrJSON").addEventListener("click",strJSON);
	document.getElementById("btnJSONObj").addEventListener("click",useJSONObj);
	
	divNode=document.getElementById("output");
}//onload

function strJSON(){
	//1. 문자열" 로 JSONObject형태를 생성
		var txt="{name:'탄지로',age:20,flag:true,func: function(){ return '물의호흡'; } }";
		//alert( txt ) //문자열이 이므로 값이 그대로 출력된다. 
		
	//2. eval함수로 JSONOject 생성
	var jsonObj=eval("("+ txt +")"); //소괄호 필수.
	//alert(jsonObj); //-> string에서 jsonObj로 변경.
	
	//JSONObject 값 추가 : 객체명.이름=값; 
	jsonObj.today="2025-11-10";
	
	//JSONObject 값 삭제 : delete 객체명.이름; 
	delete jsonObj.name;
	
	//3.parsing
	output=`
	<ul>
		<li>이름 : ${ jsonObj.name }</li>
		<li>나이 : ${ jsonObj.age }</li>
		<li>flag : ${ jsonObj.flag }</li>
		<li>함수 : ${ jsonObj.func() }</li>
		<li>추가된값 : ${ jsonObj.today }</li>
	</ul>
	`;
	//4.div에 설정
	divNode.innerHTML=output;
	
}//strJSON
function useJSONObj(){
	//중괄호만 써서 JSONOject 생성 : 중괄호 들어가면 일단 객체로 알자.
	var jsonObj={name:'젠이츠',age:19,flag:true,func: function(){ return '번개의 호흡 1형, 벽력일섬'; } }; 
	
	//JSONObject 값 추가 : 객체명.이름=값; 
	jsonObj.today="2025-11-10";
	
	//JSONObject 값 삭제 : delete 객체명.이름; 
	delete jsonObj.name;
	
	//3.parsing
	output=`
	<ul>
		<li>이름 : ${ jsonObj.name }</li>
		<li>나이 : ${ jsonObj.age }</li>
		<li>flag : ${ jsonObj.flag }</li>
		<li>함수 : ${ jsonObj.func() }</li>
		<li>추가된값 : ${ jsonObj.today }</li>
	</ul>
	`;
	//4.div에 설정
	divNode.innerHTML=output;

	
}//useJSONObj


</script>
</head>
<body>
	<div id="wrap">
		<!-- wrap 1200(w) x 1000(h) -->
		<div id="header"></div>
		<div id="container">
			<div>
				<input type="button" value="string JSONObject 사용"
					class="btn btn-success" id="btnStrJSON" /> <input type="button"
					value="JSONObject 객체 사용" class="btn btn-primary" id="btnJSONObj" />
			</div>
			<div id="output"></div>
		</div>
		<div id="footer"></div>
	</div>
</body>
</html>
