<title>이터널리턴 지금바로다운로드</title>

<style type="text/css">
#wrap {
	margin: 0px auto;
	width: 1200px;
	height: 1000px;
}

#header {
	height: 150px;
}

#container {
	height: 700px;
}

#footer {
	height: 150px;
}
</style>
<!--JS 실습 파트-->
<script type="text/javascript">
	let ss = window.sessionStorage;
	let divNode;
	var obj;
	var jsonObj
	
window.onload=function(){
	//1.스토리지 얻기
	document.getElementById("btnInputJson").addEventListener("click",setJson);
	document.getElementById("btnOutputJson").addEventListener("click",getJson);
	
	divNode = document.getElementById("output");
	obj = document.frm;
	
	
}//window

function setJson() {
	var name = frm.name.value;
	var age = frm.age.value;
	//alert(name+age);
	
	if( name == "" ){
		alert("이름은 필수입니다..");
		return;
	}//end if
	if( age == "" ){
		alert("나이도 필수입니다..");
		return;
	}//end if
	
	jsonObj = {name:name, age:age};
	console.log(jsonObj);
	divNode.innerHTML="json에 값(아이템) 저장";
	
}//setItem

function getJson(){
	if(jsonObj==null){
		divNode.innerHTML="입력을 먼저 해주세요";
	}//end if
	
	//console.log(jsonObj);	

	
	//출력용 DIV에 얻은 값을 출력
	divNode.innerHTML=`
		<marquee scrollamount="50" direction="right"  behavior="alternate">
			<ul>
				<li>이름 : ${ jsonObj.name }</li>
				<li>나이 : ${ jsonObj.age }</li>
			</ul>
		</marquee>
	`;	
	
}//getItem

function removeItem() {
	//하나 지우기
	//ss.removeItem("name");
	//전체 지우기
	ss.clear();
}//removeItem

</script>
</head>
<body>
	<div id="wrap">
		<!-- wrap 1200(w) x 1000(h) -->
		<div id="header"></div>
		<div id="container">
			
				<div>
				<form name="frm">
					<label>이름</label> <input type="text" name="name" id="name" value="우즈이"><br />
					<label>나이</label> <input type="text" name="age" id="age" value="25"><br />
					<br />
				 </form>
					
				</div>
		
			<br>
			<div>
				<input type="button" value="JSON 입력"
					class="btn btn-success" id="btnInputJson" /> 
				<input type="button" value="JSON 출력"
					class="btn btn-danger" id="btnOutputJson" />
			</div>
			<div id="output"></div>
		</div>

		<div id="footer"></div>
	</div>
</body>
