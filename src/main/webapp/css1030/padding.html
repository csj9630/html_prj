<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css" >

div{border: 1px solid#333; width: 300px; height:100px;}
#padding {padding:10px;} /* 전방향 바깥 여백 적용 */
#padding2 {padding-left:50px;} /* 왼쪽 여백 적용 */
#padding3 {padding-top:50px;} /* 위쪽 여백 적용 */
#padding4 {padding-right:50px; float: right;} /* 오른쪽 여백 적용 */
#padding5 {padding-bottom:50px;}/* 아래쪽 여백 적용 */
input {padding: 10px 50px 10px 100px;} /*상 우 하 좌*/

</style>
</head>
<body>
<div id="padding">padding-all</div>
<div id="padding2">padding-left</div>
<div id="padding3">padding-top</div>
<div id="padding4">padding-rigth</div>
<div id="padding5">padding-bottom</div>
<input type="text" value="안녕하세요"/>
</body>
</html>
