<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>float : 객체 정렬</title>
<style type="text/css">

#wrap{
	width:600px; height:300px;
	border: 1px solid #333;
	margin:0px auto;/*가운데 정렬*/
}
#right{
	width:100px; height:100px;
	border: 1px solid #5600D8;
	float:right;
}
#left{
	width:100px; height:100px;
	border: 1px solid #23BFBF;
	float:left;
}

</style>

</head>
<body>
	<div id="wrap">
		<div id="right">오른쪽</div>
		<div id="left">왼쪽</div>
	</div>
</body>
</html>
