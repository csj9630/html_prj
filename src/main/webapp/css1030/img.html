<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">

/*공통 속성은 tag selector  */
div {
	border: 1px solid #333;
	width: 500px;
	height: 300px;
}

table {
background: #FFFFFF;
}

/*개별 속성은 다른 selector  */

#y {background: #FFFFFF url(../common/images/google.png) repeat-y;}

#norepeat {background: #FFFFFF url(../common/images/google.png) no-repeat;}

body {	background: #FFFFFF url(../common/images/robot.png)}

#numTitle {width:80px;}
#numTitle {width:100px;}
#numTitle {width:120px;}


</style>
