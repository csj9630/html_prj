<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<style type="text/css">
table, th, td, div {
	border: 1px solid #333;
	
}

th, td, div {
	width: 300px;
	height: 200px;
}

/*데이터보다 표현하는 범위가 넓어서 정렬 가능*/
th, td {
	text-align: right;
	vertical-align: top;
}
/*div는 데이터와 표현 범위가 비슷해서 정렬 불가*/
div {
	text-align: right;
	vertical-align: top;
}
</style>
<body>
	<table>
		<tr>
			<th>체인su</th>
		</tr>
	</table>
	<table>
		<tr>
			<th>su트레인지</th>
		</tr>
	</table>

	<div>카평</div>
</body>
</html>
