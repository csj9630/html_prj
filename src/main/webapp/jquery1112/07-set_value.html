 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<style type="text/css">
#wrap{  margin: 0px auto; width: 1200px; height: 1000px; }	
#header{ height: 150px;	 }	
#container{ height: 700px;	 }	
#footer{ height: 150px;}	
</style>

<!-- JQuery 세트 -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<!--JS 실습 파트-->
<script type="text/javascript">
//document.ready
$(function(){
	$("#btn").click(setValue);
	$("#img").mouseover(setImg);
	$("#img").mouseout(setImg2);
	$("#btn2").click(setAttr);//남자 checked
	$("#btn3").click(setAttr2);//여자 checked
});//ready

function setValue(){
	//value속성으로 값을 설정하는 Form Control은 val()로 값을 설정한다.
	//div태그는 value속성으로 값을 넣을 수 없다.
	$("#output").val("asdfjhkldsfhjklsadfjhksadfkjh");
	$("#output").html("asdfjhkldsfhjklsadfjhksadfkj");
	$("#name").val("민병조");
	$("#pass").val("12345");
	$("#ta").val("부거킹에서 햄부기르크함부스딱스을 먹다.");
	//$("#img").val(".../common/images/kimblackSurvial.png");
	//속성을 바꿀 때는 prop로.
	$("#img").prop("src","../common/images/kimblackSurvial.png");
}//setValue

function setImg(){
	$("#img").attr("src","../common/images/kimblackSurvial.png");
}//setImg

function setImg2(){
	$("#img").attr("src","../common/images/CAR_199.png");
	
}//setImg

function setAttr(){
	//라디오버튼에 checked가존재하지 않으면 속성을 생성
	//$("#m").attr("checked",true);
	$("#m").prop("checked",true);
}
function setAttr2(){
	//$("#f").attr("checked",true);
	$("#f").prop("checked",true);
}




</script>
</head>
<body>
<div id="wrap">
	<div id="header">header 1200(w) x 150(h)
			사이트로고, 주력서비스, navigation bar
	 </div>
	<div id="container">
	<div>
	<input type="text" name="name" id="name"/><br>
	<input type="password" name="pass" id="pass"/><br>
	<textarea style="width: 300px;height: 100px" id="ta"></textarea><br>
	<img src="../day1024/images/test_img.png" id="img" style="width: 100px">
	<br>
	<input type="button" value="값설정" id="btn" class="btn btn-primary btn-sm"/><br>
	<input type="radio" value="남자" name="gender" id="m" />남자
	<input type="radio" value="여자" name="gender" id="f" />여자
	<br>
	<input type="button" value="남자선택" id="btn2" class="btn btn-primary btn-sm"/>
	<input type="button" value="여자선택" id="btn3" class="btn btn-primary btn-sm"/><br>
	<br>
	<input type="button" value="값설정" id="btn" class="btn btn-primary btn-sm"/><br>
	
	</div>
		<div id="output">
		
		</div>
	</div>
	<div id="footer">footer 1200(w) x 150(h)</div>
</div>
</body>
