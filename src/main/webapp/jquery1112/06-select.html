<style type="text/css">
#wrap{  margin: 0px auto; width: 1200px; height: 1000px; }	
#header{ height: 150px;	 }	
#container{ height: 700px;	 }	
#footer{ height: 150px;}	
</style>

<!-- JQuery 세트 -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<!--JS 실습 파트-->
<script type="text/javascript">
$(function(){
	//btn에 이벤트를 발생시켜서 useSelect함수를 호출
	$("#btn").click( useSelect );
});

function useSelect(){
	console.log("d얼g...");
//	console.log($("#loc option:eq(1)").is(":selected"));
//	console.log($("#loc option:eq(1)").val());
	var selArr=$("#loc option");//아이디가 loc인 태그의 모든 option을 가져와서
	
	$.each(selArr,function(i, ele){
		if( $(ele).is(":selected") ){//옵션중에 선택된 것이 있다면
			alert( $(ele).val());//값을 얻어온다.
		}//end if		 
	});
	
	/*
	var selArr=$("loc option");
	for (var i=0; i<selArr.length; i++){
		console.log($("#loc option:eq("+i+")").is(":selected"));
	}
	*/
	
	
	
}//useSelect
</script>

<div id="wrap">
	<div id="header">header 1200(w) x 150(h)
			사이트로고, 주력서비스, navigation bar
	 </div>
	<div id="container">
	<div>
	<select id="loc">
	<option value="서울">서울</option>
	<option value="경기">경기도</option>
	<option value="충청도">충청도</option>
	<option value="경상도">경상도</option>
	<option value="전라도">전라도</option>

	</select>
	
	<input type="button" value="선택" class="btn btn-success" id="btn"/>
	<div id="output"></div>
	</div>
	</div>
	<div id="footer">footer 1200(w) x 150(h)</div>
</div>
</body>
