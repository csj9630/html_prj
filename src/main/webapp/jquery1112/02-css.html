	<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon" href="http://192.168.10.82/html_prj/common/images/favicon2.ico">
<meta charset="UTF-8">
<title>이터널리턴 지금바로다운로드</title>
<!--실습에서 만든 CSS <link rel="stylesheet" type="text/css" href="http://192.168.10.82/html_prj/common/css/main_v251031.css"/>-->
<!-- bootStrap CDN ---------------------->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
 <!----------------------- bootStrap CDN -->
 
<style type="text/css">
#wrap{  margin: 0px auto; width: 1200px; height: 1000px; }	
#header{ height: 150px;	 }	
#container{ height: 700px;	 }	
#footer{ height: 150px;}	

#output{border:1px solid #333; width: 400px; height:200px; background-color:#BB8418}
#output2{border:1px solid #333; width: 400px; height:200px; background-color:#5600D8}

.output{ border:  1px solid #333; width: 400px; height: 200px; background-color:#BB841B }
.output2{ border:  1px solid #FF0000; width: 200px; height: 100px;  }

</style>

<!-- JQuery 세트 -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<!--JS 실습 파트-->
<script type="text/javascript">
 function getCssValue() {
		var output;
		
		output= $("#output").css("border")+"<br>";
		output+= $("#output").css("width")+"<br>";
		output+= $("#output").css("height")+"<br>";
		output+= $("#output").css("background-color")+"<br>";
		
		$("#output").html( output );	
}//getCssValue

function setCssValue() {
	$("#output2").css( "height","100px" );	
	
}//setCssValue

function removeClass() {
	$("#useClass").removeClass("output");
	
}//removeClass

function addClass() {
	//removeClass();
	//$("#useClass").addClass("output2");
	//체인 오브젝트 가능. : 함수 호출 때마다 jQuery Object가 리턴됨
	$("#useClass").removeClass("output").addClass("output2");
	
}//removeClass
</script>
</head>
<body>
<div id="wrap">
	<div id="header">header 1200(w) x 150(h)
			사이트로고, 주력서비스, navigation bar
	 </div>
	<div id="container">
	<div>
		<input type="button" value="css 속성값 얻기" class="btn btn-success" onclick="getCssValue()"/>
		<input type="button" value="css 속성값 넣기" class="btn btn-info" onclick="setCssValue()"/>
		<input type="button" value="class속성 삭제" class="btn btn-danger" onclick="removeClass()"/>
		<input type="button" value="class속성추가" class="btn btn-primary" onclick="addClass()"/>
	</div>
		<div id="output"></div>
		<div id="output2"></div>
		<div id="useClass" class="output">눕고 싶다이</div>
	</div>
	<div id="footer">footer 1200(w) x 150(h)</div>
</div>
</body>
</html>
