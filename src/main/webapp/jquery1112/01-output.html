<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon" href="http://192.168.10.82/html_prj/common/images/favicon2.ico">
<meta charset="UTF-8">
<title>이터널리턴 지금바로다운로드</title>
<!--실습에서 만든 CSS <link rel="stylesheet" type="text/css" href="http://192.168.10.82/html_prj/common/css/main_v251031.css"/>-->
<!-- bootStrap CDN ---------------------->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
 <!----------------------- bootStrap CDN -->
 
<style type="text/css">
#wrap{  margin: 0px auto; width: 1200px; height: 1000px; }	
#header{ height: 150px;	 }	
#container{ height: 700px;	 }	
#footer{ height: 150px;}	
</style>

<!-- JQuery 세트 -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<!--JS 실습 파트-->
<script type="text/javascript">
	
/* 
$(function(){ //document ready는 HTML <body>와 같은 시간에 로딩이 된다. 
	alert($("#output").text())	
})
*/
	
//onclick으로 호출하면 1.<body>가 로딩되고, 2.함수가 호출되므로 $(funciton(){ }) 을
//사용하지 않아도 된다. 

	function useHTML() {
		alert($("#output").text());
		var msg = "<h3>그게 왜 진조 탓이더냐?</h3>";
		$("#output").html(msg);//출력 시 폰트 크기가 커져서 출력
	}//useHTML()
	
	function useText() {
		var msg = "<h3>그게 왜 진조 탓이더냐?</h3>";
		$("#output").text(msg);//출력시 <h3> 태그까지 그대로 출력
	}//useText




</script>
</head>
<body>
<div id="wrap">
	<div id="header">header 1200(w) x 150(h)
			사이트로고, 주력서비스, navigation bar
	 </div>
	<div id="container">
		<div>
			<input type="button" value="html 출력" class="btn btn-success" onclick="useHTML()"/>
			<input type="button" value="text 출력" class="btn btn-success" onclick="useText()"/>
		
		</div>
	
		<div id="output">제하하하하하</div>
	</div>
	<div id="footer">footer 1200(w) x 150(h)</div>
</div>
</body>
</html>
