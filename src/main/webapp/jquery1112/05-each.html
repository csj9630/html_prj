<title>이터널리턴 지금바로다운로드</title>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<style type="text/css">
#wrap{  margin: 0px auto; width: 1200px; height: 1000px; }	
#header{ height: 150px;	 }	
#container{ height: 700px;	 }	
#footer{ height: 150px;}	
</style>

<!-- JQuery 세트 -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<!--JS 실습 파트-->
<script type="text/javascript">
$(function(){
	$("#btn").click( chkVal );
	$("#btn2").click( chkVal2 );
	$("#btn3").click( useArr );
	$("#btn5").click( useArr2 );//ready 시기에는 btn5가 없었음.
});//ready


function chkVal(){
	//태그를 찾고 바로 반복
	var output="";
	
	//var cnt=0;
	//$(".chk:checked").each(function(i, chk){
	$(".chk:checked").each(/*반복시키켜서 무기함수를 호출하는 코드가 숨어있음.*/function(i, chk){
		output+= $(chk).val()+" ";
	//	cnt++;
	});//each
	//alert( cnt )
	//관심언어는 3개까지만 선택할 수 있도록 사용자에게 alert로 안내
	if($(".chk:checked").length  > 3 ){
		alert("관심언어는 3개까지만 선택해주세요.");
		return;
	}//end if
	
	$("#output").html( output );
}//func

//내가 작성한 chkVal2
function chkVal2_1(){
	//태그를 찾은 후 반복을 분리
	console.log("asdfgd");
	var chkArr=$(".chk:checked"); //checked속성인 태그만 얻어와서
	
	var output="";
	//----------each를 써서 반복하고 output에 출력-----------------

	$(chkArr).each(function (i,chk) {
		output+= `<h3>${$(chk).val()}</h3><br>`;
	});

	
	$("#output").html( output );
}//fucn

//강사님 chkVal2
function chkVal2(){
	//태그를 찾은 후 반복을 분리
	var chkArr=$(".chk:checked"); //checked속성인 태그만 얻어와서
	
	var output="";
	//each를 사용하여 반복하여 output div에 출력 해보세요.
	$.each(chkArr,function(i, ele){
		output+=`<label><strong>${ i+1 }</strong>.</label>
				<input type="text" name="selLeng" value="${ $(ele).val() }"/><br>`;
	});//each
	
	output+="<input type='button' value='값전송' class='btn btn-info' id='btn5' onclick='useArr2()'>";
 	$("#output").html( output );
}//func
	
	
//배열 반복
function useArr(){
	var arr=["Java","Oracle","JDBC","HTML","CSS"];
	
	$.each(arr,function(i, ele){
		alert(i+"번째 방에는 "+ele+" 가 있음.");
	});
}//useArr
	
	
function useArr2() {
	//console.log("로딩 시기가 안 맞으면 태그에 inline 이벤트로 등록");
	var langArr=$(".selLang");
	
	$.each(langArr,function(i, ele){
		alert( $(ele).val() );
	});//each
}//useArr2

</script>
</head>
<body>
<div id="wrap">
	<div id="header">header 1200(w) x 150(h)
			사이트로고, 주력서비스, navigation bar
	 </div>
<div id="container">
	<div>
		<label>관심언어</label>
	<input type="checkbox" name="lang" class="chk" value="Java"/>Java
	<input type="checkbox" name="lang" class="chk" value="C/C++"/>C/C++
	<input type="checkbox" name="lang" class="chk" value="PyThon"/>PyThon
	<input type="checkbox" name="lang" class="chk" value="JavaScript"/>JavaScript
	<input type="checkbox" name="lang" class="chk" value="Go"/>Go Lang
	<input type="checkbox" name="lang" class="chk" value="도"/>도<br>
	<input type="button" value="태그 자체반복" class="btn btn-success" id="btn"/>
	<input type="button" value="태그와 반복을 분리" class="btn btn-success" id="btn2"/><br>
	<input type="button" value="배열 반복" class="btn btn-success" id="btn3"/><br>
	<div id="output"></div>
	</div>
	</div>
	<div id="footer">footer 1200(w) x 150(h)</div>
</div>
</body>
