<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon"
	href="http://192.168.10.82/html_prj/common/images/favicon2.ico">
<meta charset="UTF-8">
<title>이터널리턴 지금바로다운로드</title>
<!--실습에서 만든 CSS <link rel="stylesheet" type="text/css" href="http://192.168.10.82/html_prj/common/css/main_v251031.css"/>-->
<!-- bootStrap CDN ---------------------->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
	crossorigin="anonymous"></script>
<!----------------------- bootStrap CDN -->

<style type="text/css">
#wrap {
	margin: 0px auto;
	width: 1200px;
	height: 1000px;
}

#header {
	height: 150px;
}

#container {
	height: 700px;
}

#footer {
	height: 150px;
}
</style>

<!-- JQuery 세트 -->
<script
	src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<!--JS 실습 파트-->
<script type="text/javascript">
	$(function() {
		//$("#btn").on("click",function(){
		//	alert("버튼이 클릭!!!");
		//});

		$("#btn").click(function() {
			alert("버튼이 클릭!!!");
		});

		$("#name").keydown(function(evt) {
			alert("키가 눌림 : " + evt.which + " / " + $("#name").val());
			//눌린키의 코드는 얻지만 값은 나오지 않는다.
		});//keydown

		$("#name2").keyup(function(evt) {
			alert("키가 올라옴 : " + evt.which + " / " + $("#name2").val());
			//눌린키의 코드값과 입력값 모두 얻을 수 있다.
		});//keydown
		
		$("#info").keyup(function(evt){
			var txtContent = $("#info").val();
			var txtLeng = txtContent.length;
			var limit = 9;
			
			//console.log(txtleng.length);
			$("#inputLeng").html(`${txtLeng}`);
			
			if(txtLeng >limit){
				alert(limit+"글자만 가능합니다.");
				$("#info").val(txtContent.substring(0,limit));
			}//end if
		});
		
		$("#img").mouseover(function(){
			console.log("마우스가 이미지에 올라옴")
		});//mouseover
		
		$("#img2").mouseout(function(){
			console.log("마우스가 이미지에 나감")
		});//mouseover

		$("#name3").focusin(function(){
			console.log("커서가 들어감");
		});//focusin
		
		$("#name4").focusout(function(){
			console.log("커서가 나감");
		});//focusin
		
		$("#sel").change(function(){ 
			$("#output").html( $("#sel").val() );
		});//change
		
		$("#btn2").click(function(){ 
			$("#info").focus(); //해당 id에 커서 요청.
		});//change
	});//ready
</script>
</head>
<body>
	<div id="wrap">
		<div id="header">header 1200(w) x 150(h) 사이트로고, 주력서비스,
			navigation bar</div>
		<div id="container">
			<div>
				<label>클릭 할 때</label><input type="button" value="클릭" id="btn" /><br>
				<label>키가 눌릴때</label><input type="text" name="txt" id="name" /><br />
				<label>키가 올라올 때</label><input type="text" name="txt" id="name2" /><br />
				<div style="width: 400px; text-align: right;">
					<textarea id="info" style="width: 400px; height: 100px"></textarea>
					<span id="inputLeng">0</span>/100
				</div>
				<label>마우스가 올라올때</label>
				<img src="../common/images/CAR_199.png" id="img"/><br>
				<label>마우스가 나갔을 때</label>
				<img src="../common/images/CAR_199.png" id="img2"/><br>	
				
				<label>커서가 들어갈 때</label>
				<input type="text" name="txt" id="name3"/><br/>
				
				<label>커서가 나갔을 때</label>
				<input type="text" name="txt" id="name4"/><br/>
				
			</div>
			<div id="output"></div>
			<label>다른 옵션이 선택</label>
			<select id="sel">
				<option value="Java">Java</option>
				<option value="Oracle DBMS">Oracle DBMS</option>
				<option value="JDBC">JDBC</option>
				<option value="HTML">HTML</option>
				<option value="CSS">CSS</option>
				<option value="JavaScript">JavaScript</option>
				<option value="JavaScript Library">JavaScript Library</option>
			</select>
			<br>
			<input type="button" value="커서요청" id="btn2"/><br>
	
			
		</div>
		<div id="footer">footer 1200(w) x 150(h)</div>
	</div>
</body>
</html>
