<style type="text/css">
#wrap{  margin: 0px auto; width: 1200px; height: 1000px; }	
#header{ height: 150px;	 }	
#container{ height: 700px;	 }	
#footer{ height: 150px;}	
</style>
<!--JS 실습 파트-->
<script type="text/javascript">
//1. 배열 생성
//빈배열
var arr=new Array();
//초기화된 배열
var arr2=[2025,"안녕",2025.11,false];

//alert( typeof(arr) + " / " + arr2 );
//2. 값 추가
arr[0]="배열";
arr[1]="가변길이형";
arr[2]="모든 값을 추가할 수 있음";

//3. 값 얻기
document.write(`${arr[0]} <br>`);

//4.일괄처리
for(var i=0 ; i < arr.length ; i++){
document.write(`${i}번째 방 ${arr[i]} <br>`);
}//end for

document.write("<ul>");
for(var i=0 ; i < arr2.length ; i++){
	document.write(`<li>${i}번째 방 ${arr2[i]} </li>`);
	}//end for
document.write("</ul>");

//arr배열에 가장 마지막방 뒤에 값 추가

//단일값
arr.push("오늘은 수요일"); // arr[3]="오늘은 수요일";
arr.push("내일은 목요일"); 
//배열을 추가
arr.push(...arr2); 


for(var i=0 ; i < arr.length ; i++){
	document.write(`${i}번째 방 ${arr[i]} <br>`);
}//end for

//배열 방의 검색
var ind=arr.indexOf("안녕");
document.write(`안녕은 ${ ind }번째 방에 존재 <br>`);

var ind=arr.indexOf("잘가");
document.write(`잘가는 ${ ind }번째 방에 존재 <br>`);

if(ind == -1){
	 msg="존재하지 않음.";
}//end if

document.write(`'잘가'는 ${ msg }<br>`);

/*
0번째 방 배열
1번째 방 가변길이형
2번째 방 모든 값을 추가할 수 있음
3번째 방 오늘은 수요일
4번째 방 내일은 목요일
5번째 방 2025
6번째 방 안녕
7번째 방 2025.11
8번째 방 false
 */
 arr.splice(2,3);
 
 for(var i=0 ; i < arr.length ; i++){
		document.write(`${i}번째 방 ${arr[i]} <br>`);
	}//end for

</script>
