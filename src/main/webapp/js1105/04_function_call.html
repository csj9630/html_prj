		alert(`${ evt_attr }함수 호출`);
	}

<body>
<!-- <body onload="call('HTML 로딩될때')"> -->
<input type="button" value="클릭" onclick="call('클릭했을 때')"
		class="btn btn-success btn-sm"/>
		<br>
<img src="../common/images/google.png" onclick="call('클릭했을 때')"/>

<table class="table table-hover">
<tr>
<td onclick="call('클릭했을 때')">eclipse</td>
</tr>
<tr>
<td>Editplus</td>
</tr>
</table>
<br>
<input type="button" value="더블클릭" ondblclick="call('더블 클릭했을 때')"
		class="btn btn-warning btn-sm"/>
		
<div class="mb-3" style="width:400px">
<label for="exampleFormControlInput1" class="form-label">Email address</label>

</div>
<div class="mb-3" style="width:400px">

<textarea class="form-control"  onkeyup="call('키가 올라올 때 ')" id="exampleFormControlTextarea1" rows="3"></textarea>
</div>


<label>마우스가 올라가면</label>
<img src="../common/images/google.png" onmouseover="call('마우스가 올라갔을 때')"/><br/>

<br>
<label>이전에 선택한 옵션과 다른 옵션이 선택</label>

<option>A</option>
<option>B</option>
<option>C</option>
</select><br>
<label>커서가 들어갔을 때의 값과 커서가 빠져 나갔을 때의 값이 다른때</label>
<input type="text" onchange="call('커서 전후 값이 변경되었을 때')"/><br>
<label> 커서가 빠져 나갔을 때</label>
<input type="text" onblur="call('커서가 빠져 나갔을 때')"/>
