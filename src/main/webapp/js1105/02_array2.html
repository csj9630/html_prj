<style type="text/css">
#wrap{  margin: 0px auto; width: 1200px; height: 1000px; }	
#header{ height: 150px;	 }	
#container{ height: 700px;	 }	
#footer{ height: 150px;}	
</style>
<!--JS 실습 파트-->
<script type="text/javascript">

//1.일차원 배열 생성
var arr2=new Array();
//2. 각방에 일차원 배열을 생성. ( 가변 배열 )
arr2[0]=new Array();

//3.값 할당
arr2[0][0]="이것이";
arr2[0][1]="자바다";
arr2[0][2]="신용권";

arr2[1]=["HTML5","웹프로그래밍입문","윤인성"];
arr2[2]=["데이터베이스","개론과 실습","박우창"];

//4. 일괄처리
document.write("<table class='table table-hover'>")
for(var i=0 ; i < arr2.length ; i++){
document.write("<tr>");
	for(var j=0 ; j < arr2[i].length ; j++){
		document.write(`<td style='width:120px'>${ arr2[i][j]}</td>`);
	}//end for
document.write("</tr>");
}//end for
document.write("</table>");
</script>
</head>
<body>
<div id="wrap">
	<!-- wrap 1200(w) x 1000(h) -->
	<div id="header"> 	 </div>
	<div id="container"> </div>
	
	<div id="footer"> </div>
</div>
</body>
