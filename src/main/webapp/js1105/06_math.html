<style type="text/css">
#wrap{  margin: 0px auto; width: 1200px; height: 1000px; }	
#header{ height: 150px;	 }	
#container{ height: 700px;	 }	
#footer{ height: 150px;}	
</style>
<!--JS 실습 파트-->
<script type="text/javascript">
var num=-11;
document.write(`${ num }에 절대값 ${ Math.abs(num) }<br>`);

num=11.5;
document.write(`${ num }을 반올림 값 ${ Math.round(num) }<br>`);

num=11.9;
document.write(`${ num }을 내림 값 ${ Math.floor(num) }<br>`);

num=11.1;
document.write(`${ num }을 올림 값 ${ Math.ceil(num) }<br>`);

num=Math.random();
document.write(`발생한 난수 ${ num }<br>`);
document.write(`범위의 난수 ${ num * 10 }<br>`);
document.write(`범위의 정수 난수 ${ parseInt(num * 10) }<br>`);

var dice_num = parseInt(num * 10 % 6 +1);
document.write(`주사위 ${ dice_num }<br>`);

document.write(`<img src='../common/images/dice/dice_${dice_num}.png'/><br/>`);
function diceRoll() {
	document.write(`<img src='../common/images/dice/dice_${dice_num}.png'/><br/>`);
}//fuc


</script>

<body>
<div id="wrap">
	<!-- wrap 1200(w) x 1000(h) -->
	<div id="header">
		<button type="button" value="운명의다이스롤" class="btn btn-outline-info" onclick="diceRoll()">운명의다이스롤</button>
	</div>
	<div id="container"> </div>
	
	<div id="footer"> </div>
</div>
