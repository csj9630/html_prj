<style type="text/css">
#wrap {
	margin: 0px auto;
	width: 1200px;
	height: 1000px;
}

#header {
	height: 150px;
}

#container {
	height: 700px;
}

#footer {
	height: 150px;
}
</style>
<!--JS 실습 파트-->
<script type="text/javascript">
	function useInnerHTML() {
		var divNode = document.getElementById("output");
		divNode.innerHTML = "<strong>임성우 짱!</strong><img src='../common/images/james.png' title='허허허 자네 훌륭하구만!!'>";
		//alert( divNode )
	}
</script>
</head>
<body>
	<div id="wrap">
		<!-- wrap 1200(w) x 1000(h) -->
		<div id="header">
			<h2>InnerHTML - 동적으로 디자인 바꾸기</h2>
		</div>
		<div id="container">
			<div id="output">
				
				<input type="button" value="click" class="btn btn-success"
					onclick="useInnerHTML()" />
			</div>
		</div>

		<div id="footer"></div>
	</div>
</body>
