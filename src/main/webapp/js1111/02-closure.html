<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon" href="http://192.168.10.82/html_prj/common/images/favicon.ico">
<meta charset="UTF-8">
<title>이터널리턴 지금바로다운로드</title>
<!--실습에서 만든 CSS <link rel="stylesheet" type="text/css" href="http://192.168.10.82/html_prj/common/css/main_v251031.css"/>-->
<!-- bootStrap CDN ---------------------->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
 <!----------------------- bootStrap CDN -->
 
<style type="text/css">
#wrap{  margin: 0px auto; width: 1200px; height: 1000px; }	
#header{ height: 150px;	 }	
#container{ height: 700px;	 }	
#footer{ height: 150px;}	
</style>
<!--JS 실습 파트-->
<script type="text/javascript">
window.onload=function(){
	var output;
	//()사용한 closure
	//1.선언
	var clo=({
				name:"민병조", age:25,
				hellMsg:function( to ){ 
							return to+"님 어서오고!";
							
						}//func
			});
	//2.사용( parsing ) 
	
	
	
	output=`
		<ul>
		<li><strong>이름: </strong>${ clo.name }</li>
		<li><strong>나이: </strong>${ clo.age }</li>
		<li><strong>메시지: </strong>${ clo.hellMsg("사su케") }</li>
		</ul>
		`;
	
	
	document.getElementById("output").innerHTML=output;
}//onload
</script>
</head>
<body>
<div id="wrap">
	<div id="header">header 1200(w) x 150(h)
			사이트로고, 주력서비스, navigation bar
	 </div>
	<div id="container">
		<div id="output">
		
		</div>
	</div>
	<div id="footer">footer 1200(w) x 150(h)</div>
</body>
</html>
