<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>테이블로 이력서 폼 만들기</title>
</head>
<body>
	<table border="1" cellspacing="0">
		<thead>
			<tr>
				<th width="80">번호</th>
				<th width="50">이름</th>
				<th width="70">나이</th>

			</tr>
		</thead>
		<tbody>
			<tr>
				<td>1</td>
				<td>민병조</td>
				<td>8</td>
			</tr>
			<tr>
				<td>2</td>
				<td>알렉스</td>
				<td>13</td>
			</tr>
			<tr>
				<td>3</td>
				<td>펠릭스</td>
				<td>28</td>
			</tr>
		</tbody>
		<tfoot>
			<tr>
				<td colspan="2">결과</td>
				<td>28</td>
			</tr>
		</tfoot>
	</table>
</body>
</html>
