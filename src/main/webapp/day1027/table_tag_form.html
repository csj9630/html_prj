<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>
</head>
<body>
<h2>칸 합치기</h2>
<table border="1" width="300" height="300">
<tr>
	<td>1</td>
	<td>2</td>
	<td>3</td>
</tr>
<tr>
	<td>4</td>
	<td>5</td>
	<td>6</td>
</tr>
<tr>
	<td>7</td>
	<td>8</td>
	<td>9</td>
</tr>
</table>
<h3>시작하는 td에서 colspan = "합칠 칸의 수" 뒤에 td를 삭제</h3>
<table border="1" width="300" height="300">
<tr>
	<td colspan="2" >1</td>
	<!-- <td>2</td> -->
	<td>3</td>
</tr>
<tr>
	<td>4</td>
	<td colspan="2">5</td>
<!-- 	<td>6</td> -->
</tr>
<tr>
	<td colspan="3" width="300"> 7</td>
<!-- 	<td>8</td>
	<td>9</td> -->
</tr>
</table>

<h2>행 합치기</h2>
<table border="1" width="300" height="300">
<tr height="100">
	<td rowspan="2">1</td>
	<td>2</td>
	<td>3</td>
</tr>
<tr height="100">
<!-- 	<td>4</td> -->
	<td>5</td>
	<td>6</td>
</tr>
<tr height="100">
	<td>7</td>
<!-- 	<td>8</td>
	<td>9</td> -->
</tr>
</table>

<h2>복합으로 합치기</h2>
<table border="1" width="300" height="300">
<tr>
	<td rowspan="2" bgcolor="#00FF65">1</td>
	<td colspan="2" bgcolor="#6B00D7">2</td>
<!-- 	<td>3</td> -->
</tr>
<tr">
<!-- 	<td>4</td> -->
	<td>5</td>
	<td rowspan="2">6</td>
</tr>
<tr>
	<td colspan="2">7</td>
<!-- 	<td>8</td>
	<td>9</td> -->
</tr>
</table>



</body>
</html>
