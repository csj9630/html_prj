<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h3>자식 태그로 th, td 두 개만 가진다..</h3>
	<h3>th,td는 tr 안에서만 있어야 한다.</h3>
	<table>
		<tr>
			<th>이름</th>
			<th>과목</th>

		</tr>
		<tr>
			<td>김철수</td>
			<td>자바</td>
		</tr>
	</table>
	<h3>tr 속성</h3>
	<table border="1" cellpadding="5" cellspacing="0" width="400">
		<tr height="30" bgcolor="#23BF23" background="../common/images/naver.png" 
		align="right" valign="top">
			<td>월요일</td>
			<td>화요일</td>
		</tr>
		<tr height="50" bgcolor="#1C991C" align="left" valign="bottom">
			<td>수요일</td>
			<td>목요일</td>
		</tr>
	</table>
	
	<h3>td의 속성</h3>
	<h3>속성은 상속되므로 자식 태그가 각각 가져야할 값이 아니라면 부모태그에 올려서 사용한다.</h3>
	<table border="1" cellpadding="0" >
		<tr>
			<td width="100" height="80">월요일</td>
			<td>화요일</td>
		</tr>
		<tr>
			<td>수요일</td>
			<td>목요일</td>
		</tr>
	</table>
</body>
</html>
