<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>테이블의 정렬</title>
</head>
<body>
	<h4>th의 기본 속성 : 진하게, 가운데 정렬</h4>
	<h4> 테이블에 align 정렬을 주면 높이 변경이 잘 안된다.</h4>
	<table border="1" align="left">
		<tr>
			<th width="80">번호</th>
			<th width="120">이름</th>
			<th width="400">주소</th>
		</tr>
		<tr>
			<td >1</td>
			<td >민병조</td>
			<td >서울시 강남구 대치동</td>
		</tr>
		<tr>
			<td >2</td>
			<td >이지원</td>
			<td >서울시 강남구 역삼동</td>
		</tr>
	</table>
	
	<table border="1" align="center">
		<tr>
			<th width="80">번호</th>
			<th width="120">이름</th>
			<th width="400">주소</th>
		</tr>
		<tr>
			<td >1</td>
			<td >민병조</td>
			<td >서울시 강남구 대치동</td>
		</tr>
		<tr>
			<td >2</td>
			<td >이지원</td>
			<td >서울시 강남구 역삼동</td>
		</tr>
	</table>
</body>
</html>
